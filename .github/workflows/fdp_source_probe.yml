name: FDP Berlin asset
on:
  push:
    branches: [fdp-render-20260903]
    paths:
      - '.github/workflows/fdp_source_probe.yml'
      - 'cloud_render/berlin_asset.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download vertical Berlin 2026 CC footage
        run: |
          python3 -m pip install --disable-pip-version-check -q requests
          python3 cloud_render/berlin_asset.py
      - name: Upload Berlin asset
        uses: actions/upload-artifact@v4
        with:
          name: berlin-vertical-2026
          path: berlin_asset
          retention-days: 2
