name: Kubicki clean video probe
on:
  push:
    branches: [fdp-render-20260903]
    paths:
      - '.github/workflows/fdp_source_probe.yml'
      - 'cloud_render/kubicki_video_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
          python3 -m pip install --disable-pip-version-check -q yt-dlp pillow
      - name: Probe clean official Kubicki footage
        run: python3 cloud_render/kubicki_video_probe.py
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubicki-clean-video-probe
          path: kubicki_probe
          retention-days: 2
