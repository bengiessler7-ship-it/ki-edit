name: FDP Kubicki press asset
on:
  push:
    branches: [fdp-render-20260903]
    paths:
      - '.github/workflows/fdp_source_probe.yml'
      - 'cloud_render/kubicki_press_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download current official FDP Kubicki press photo
        run: |
          python3 -m pip install --disable-pip-version-check -q requests
          python3 cloud_render/kubicki_press_probe.py
      - name: Upload Kubicki asset
        uses: actions/upload-artifact@v4
        with:
          name: kubicki-press-2026
          path: kubicki_press
          retention-days: 2
