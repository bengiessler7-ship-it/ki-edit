name: Kubicki short sections
on:
  push:
    branches: [fdp-render-20260903]
    paths:
      - '.github/workflows/fdp_source_probe.yml'
      - 'cloud_render/kubicki_zdf_sections.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
          python3 -m pip install --disable-pip-version-check -q yt-dlp pillow
      - name: Download short Kubicki sections
        run: python3 cloud_render/kubicki_zdf_sections.py
      - name: Upload Kubicki sections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubicki-zdf-sections
          path: kubicki_sections
          retention-days: 2
