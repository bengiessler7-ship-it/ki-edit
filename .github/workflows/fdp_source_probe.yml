name: Kubicki multi sources
on:
  push:
    branches: [fdp-render-20260903]
    paths:
      - '.github/workflows/fdp_source_probe.yml'
      - 'cloud_render/kubicki_multi_sources.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
          python3 -m pip install --disable-pip-version-check -q yt-dlp pillow
      - name: Download varied Kubicki clips
        run: python3 cloud_render/kubicki_multi_sources.py
      - name: Upload varied Kubicki clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubicki-multi-sources
          path: kubicki_multi
          retention-days: 2
