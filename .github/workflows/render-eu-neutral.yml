name: Render EU Neutral Real Footage Edit

on:
  push:
    branches:
      - chatgpt-eu-neutral-render-20260904

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render V4 1080x1080 real-footage background
        shell: bash
        run: |
          mkdir -p eu-render-v4
          set +e
          bash -x eu-render/render_v4_bg.sh 2>&1 | tee eu-render-v4/render-debug.log
          status=${PIPESTATUS[0]}
          echo "$status" > eu-render-v4/render-exit-code.txt
          exit "$status"

      - name: Upload V4 background and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-v4-real-footage-background
          path: |
            eu-render-v4/background_v4.mp4
            eu-render-v4/render_probe.json
            eu-render-v4/SHA256SUMS.txt
            eu-render-v4/render-debug.log
            eu-render-v4/render-exit-code.txt
          if-no-files-found: warn
          retention-days: 1
