name: Render EU Neutral Real Footage Edit

on:
  push:
    branches:
      - chatgpt-eu-neutral-render-20260904

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render 1080x1080 real-footage edit
        shell: bash
        run: |
          # Render revision: clean opening + MOGGED + official 2026 FDP logo motion.
          set +e
          bash -x eu-render/render.sh 2>&1 | tee eu-render/render-debug.log
          status=${PIPESTATUS[0]}
          echo "$status" > eu-render/render-exit-code.txt
          exit "$status"

      - name: Upload rendered video and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-neutral-real-footage-video
          path: |
            eu-render/EU_REAL_FOOTAGE_NEUTRAL_VIDEO_ONLY.mp4
            eu-render/render_probe.json
            eu-render/SHA256SUMS.txt
            eu-render/render-debug.log
            eu-render/render-exit-code.txt
          if-no-files-found: warn
          retention-days: 1
