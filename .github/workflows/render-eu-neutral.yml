name: Render EU Neutral Real Footage Edit

on:
  push:
    branches:
      - chatgpt-eu-neutral-render-20260904

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render V2 1080x1080 real-footage edit
        shell: bash
        run: |
          mkdir -p eu-render-v2
          set +e
          bash -x eu-render/render_v2.sh 2>&1 | tee eu-render-v2/render-debug.log
          status=${PIPESTATUS[0]}
          echo "$status" > eu-render-v2/render-exit-code.txt
          exit "$status"

      - name: Upload rendered V2 and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-neutral-real-footage-video-v2
          path: |
            eu-render-v2/EU_EDIT_V2_VIDEO_ONLY.mp4
            eu-render-v2/render_probe.json
            eu-render-v2/SHA256SUMS.txt
            eu-render-v2/render-debug.log
            eu-render-v2/render-exit-code.txt
          if-no-files-found: warn
          retention-days: 1
