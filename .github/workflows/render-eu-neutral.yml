name: Render EU Neutral Real Footage Edit

on:
  push:
    branches:
      - chatgpt-eu-neutral-render-20260904

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render 1080x1080 real-footage edit
        run: bash eu-render/render.sh

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: eu-neutral-real-footage-video
          path: |
            eu-render/EU_REAL_FOOTAGE_NEUTRAL_VIDEO_ONLY.mp4
            eu-render/render_probe.json
            eu-render/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
